name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ] 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Cordova
      run: npm install -g cordova

    - name: Create Cordova Project & Copy Files
      run: |
        cordova create myapp com.example.app "MyApp"
        
        # مسح الملفات الافتراضية ونسخ ملفاتك
        rm -rf myapp/www/*
        cp -r app_source/* myapp/www/ || true
        
        # تأكد من وجود ملف index.html
        if [ ! -f myapp/www/index.html ]; then
          echo "<h1>Hello World</h1>" > myapp/www/index.html
        fi
        
        # تغيير اسم التطبيق إذا كان الملف موجود
        if [ -f app_source/name.txt ]; then
          APP_NAME=$(cat app_source/name.txt)
          sed -i "s/<name>.*<\/name>/<name>$APP_NAME<\/name>/" myapp/config.xml
        fi
        
        cd myapp
        cordova platform add android

    - name: Build APK
      run: |
        cd myapp
        cordova build android

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: My-Android-App
        path: myapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
