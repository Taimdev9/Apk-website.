name: Build Android APK

on:
  workflow_dispatch: # هذا الخيار بيخليك تشغل البناء بضغطة زر
  push:
    branches: [ "main" ] # يشغل البناء تلقائياً إذا عدلت الملفات

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Cordova
      run: npm install -g cordova

    - name: Create Cordova Project & Copy Files
      run: |
        cordova create myapp com.example.app "MyApp"
        
        # مسح الملفات الافتراضية ونسخ ملفاتك
        rm -rf myapp/www/*
        cp -r app_source/* myapp/www/ || true
        
        # تأكد من وجود ملف index.html
        if [ ! -f myapp/www/index.html ]; then
          echo "<h1>Hello World</h1>" > myapp/www/index.html
        fi
        
        # تغيير اسم التطبيق إذا كان الملف موجود
        if [ -f app_source/name.txt ]; then
          APP_NAME=$(cat app_source/name.txt)
          sed -i "s/<name>.*<\/name>/<name>$APP_NAME<\/name>/" myapp/config.xml
        fi
        
        cd myapp
        cordova platform add android
        
        # تغيير الأيقونة إذا كانت الصورة موجودة
        if [ -f ../app_source/icon.png ]; then
          for size in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            folder=$(echo $size | cut -d: -f1)
            px=$(echo $size | cut -d: -f2)
            convert ../app_source/icon.png -resize ${px}x${px} platforms/android/app/src/main/res/mipmap-$folder/ic_launcher.png
            if [ -f platforms/android/app/src/main/res/mipmap-$folder/ic_launcher_round.png ]; then
              cp platforms/android/app/src/main/res/mipmap-$folder/ic_launcher.png platforms/android/app/src/main/res/mipmap-$folder/ic_launcher_round.png
            fi
          done
        fi

    - name: Build APK
      run: |
        cd myapp
        cordova build android

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: My-Android-App
        path: myapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
